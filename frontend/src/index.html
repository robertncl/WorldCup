<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#10132a" />
    <meta
      name="description"
      content="World Cup 2026 prediction game — real results imported as the baseline, predict the rest, project the tables and your title odds."
    />
    <title>World Cup 2026 — Prediction Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-ball" aria-hidden="true">⚽</span>
        <div class="brand-text">
          <h1>World Cup <span class="accent">2026</span> · Predictor</h1>
          <p class="subtitle">
            Canada · México · USA — predict every match
            <span id="as-of" class="as-of"></span>
          </p>
        </div>
      </div>

      <div class="controls">
        <button id="autopick-btn" class="btn" type="button">✨ Auto-pick</button>
        <button id="clear-btn" class="btn" type="button">↺ Clear picks</button>
      </div>
    </header>

    <div id="summary" class="summary" aria-label="Your prediction progress"></div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <!-- Guided three-step flow. Kept as an ARIA tablist for assistive tech, but
         presented as a connected stepper: Groups → Knockout → Odds. -->
    <nav class="stepper" role="tablist" aria-label="Stages">
      <button class="step" role="tab" id="tab-groups" data-tab="groups" aria-controls="panel-groups" aria-selected="true" tabindex="0">
        <span class="step-num" aria-hidden="true">1</span>
        <span class="step-text">
          <span class="step-name">Groups</span>
          <span class="step-sub">predict &amp; project</span>
        </span>
      </button>
      <span class="step-line" aria-hidden="true"></span>
      <button class="step" role="tab" id="tab-knockout" data-tab="knockout" aria-controls="panel-knockout" aria-selected="false" tabindex="-1">
        <span class="step-num" aria-hidden="true">2</span>
        <span class="step-text">
          <span class="step-name">Knockout</span>
          <span class="step-sub">build the bracket</span>
        </span>
      </button>
      <span class="step-line" aria-hidden="true"></span>
      <button class="step" role="tab" id="tab-odds" data-tab="odds" aria-controls="panel-odds" aria-selected="false" tabindex="-1">
        <span class="step-num" aria-hidden="true">3</span>
        <span class="step-text">
          <span class="step-name">Title odds</span>
          <span class="step-sub">run the sim</span>
        </span>
      </button>
    </nav>

    <main>
      <section id="panel-groups" class="panel" role="tabpanel" aria-labelledby="tab-groups" tabindex="0"></section>
      <section id="panel-knockout" class="panel" role="tabpanel" aria-labelledby="tab-knockout" tabindex="0" hidden></section>
      <section id="panel-odds" class="panel" role="tabpanel" aria-labelledby="tab-odds" tabindex="0" hidden></section>
    </main>

    <footer class="app-footer">
      <p>
        Real group-stage results imported as the baseline; locked matches show
        the final score. Predictions are saved in your browser. Ratings are
        approximate and for entertainment only. Built with Go &amp; Bun.
      </p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
