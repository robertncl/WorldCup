<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#232b40" />
    <meta
      name="description"
      content="World Cup 2026 prediction game — real results imported as the baseline, predict the rest, project the tables and your title odds."
    />
    <title>World Cup 2026 — Prediction Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-ball" aria-hidden="true">⚽</span>
        <div class="brand-text">
          <h1>World Cup <span class="accent">2026</span> · Predictor</h1>
          <p class="subtitle">
            Canada · México · USA — predict every match
            <span id="as-of" class="as-of"></span>
          </p>
        </div>
      </div>

      <div class="controls">
        <button id="autopick-btn" class="btn" type="button">✨ Auto-pick</button>
        <button id="clear-btn" class="btn" type="button">↺ Clear picks</button>
      </div>
    </header>

    <div id="summary" class="summary" aria-label="Your prediction summary"></div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <nav class="tab-bar" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="tab-predict" data-tab="predict" aria-controls="panel-predict" aria-selected="true" tabindex="0">Predict</button>
      <button class="tab" role="tab" id="tab-tables" data-tab="tables" aria-controls="panel-tables" aria-selected="false" tabindex="-1">Group tables</button>
      <button class="tab" role="tab" id="tab-knockout" data-tab="knockout" aria-controls="panel-knockout" aria-selected="false" tabindex="-1">Knockout</button>
      <button class="tab" role="tab" id="tab-odds" data-tab="odds" aria-controls="panel-odds" aria-selected="false" tabindex="-1">Title odds</button>
    </nav>

    <main>
      <section id="panel-predict" class="panel" role="tabpanel" aria-labelledby="tab-predict" tabindex="0"></section>
      <section id="panel-tables" class="panel" role="tabpanel" aria-labelledby="tab-tables" tabindex="0" hidden></section>
      <section id="panel-knockout" class="panel" role="tabpanel" aria-labelledby="tab-knockout" tabindex="0" hidden></section>
      <section id="panel-odds" class="panel" role="tabpanel" aria-labelledby="tab-odds" tabindex="0" hidden></section>
    </main>

    <footer class="app-footer">
      <p>
        Real group-stage results imported as the baseline; locked matches show
        the final score. Predictions are saved in your browser. Ratings are
        approximate and for entertainment only. Built with Go &amp; Bun.
      </p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
